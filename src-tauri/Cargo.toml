[package]
name = "copyboard"
version = "1.0.0"
description = "Personal clipboard manager for Windows and macOS"
authors = ["CopyBoard"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "copyboard_lib"
crate-type = ["rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
clipboard-rs = "0.3.5"
image = { version = "0.25.8", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
